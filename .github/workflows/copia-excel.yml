name: Copia Diaria de Excel

permissions:
  contents: write

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite activar el proceso manualmente desde la pestaña Actions

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Crear carpeta de datos
        run: mkdir -p datos

      - name: Descargar archivo mediante técnicas de evasión de bloqueos
        run: |
          FILENAME="datos/data_$(date +'%Y-%m-%d').xls"
          URL="https://geoportalgasolineras.es"
          
          echo "Iniciando descarga segura del archivo Excel..."
          
          # Usamos wget en lugar de curl porque gestiona mejor los certificados rotos y TLS antiguo del Ministerio
          # --no-check-certificate ignora el fallo del SSL del Gobierno de España
          # --user-agent emula un navegador real completo para saltar el firewall corporativo
          wget --no-check-certificate \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Accept-Language: es-ES,es;q=0.8" \
               --header="Connection: keep-alive" \
               "$URL" -O "$FILENAME" || { echo "Error: Falló la descarga con wget"; exit 1; }
          
          if [ ! -s "$FILENAME" ]; then
            echo "Error: El archivo descargado está vacío"
            exit 1
          fi
          
          echo "¡Éxito! Archivo Excel guardado en $FILENAME"

      - name: Guardar cambios en GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add datos/
          
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar"
          else
            git commit -m "Copia automática del Excel - $(date +'%Y-%m-%d')"
            git push origin "HEAD:${BRANCH}"
          fi
