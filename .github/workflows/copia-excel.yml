name: Copia Diaria y Consolidador Histórico

permissions:
  contents: write

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite activar el proceso manualmente desde la pestaña Actions

jobs:
  download-and-consolidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar dependencias para consolidación
        # Se añade beautifulsoup4 junto con lxml y html5lib para el análisis del HTML
        run: pip install pandas openpyxl xlrd lxml html5lib beautifulsoup4

      - name: Crear carpetas de estructura
        run: mkdir -p datos

      - name: Descargar archivo diario (XLS)
        run: |
          TEMP_XLS="datos/temp_precios.xls"
          URL="https://geoportalgasolineras.es"
          
          echo "Descargando archivo Excel del Ministerio..."
          wget --no-check-certificate \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Accept-Language: es-ES,es;q=0.8" \
               --header="Connection: keep-alive" \
               "$URL" -O "$TEMP_XLS" || { echo "Error: Falló la descarga"; exit 1; }
          
          if [ ! -s "$TEMP_XLS" ]; then
            echo "Error: El archivo descargado está vacío"
            exit 1
          fi

      - name: Procesar histórico y empaquetar ZIP
        run: |
          python -c "
          import os
          import pandas as pd
          from datetime import datetime
          import zipfile

          fecha_hoy = datetime.now().strftime('%Y-%m-%d')
          temp_xls = 'datos/temp_precios.xls'
          historico_csv = 'datos/historico_precios.csv'
          zip_final = f'datos/data_{fecha_hoy}.zip'

          print('1. Leyendo datos descargados...')
          try:
              df_hoy = pd.read_excel(temp_xls, engine='xlrd')
          except Exception:
              print('Detectado formato web/HTML camuflado. Procesando estructura...')
              listado_tablas = pd.read_html(temp_xls)
              df_hoy = listado_tablas.pop(0)
          
          # Asegurar que todas las columnas sean tratadas como texto para evitar fallos de formato al concatenar
          df_hoy.columns = [str(c).strip() for c in df_hoy.columns]
          
          # Inyectar la columna de fecha de forma segura sobre el DataFrame real
          df_hoy['Fecha_Extraccion'] = fecha_hoy

          print('2. Actualizando archivo histórico consolidado...')
          if os.path.exists(historico_csv):
              df_historico = pd.read_csv(historico_csv, low_memory=False)
              df_historico.columns = [str(c).strip() for c in df_historico.columns]
              
              # Evitar duplicar datos si ejecutas el script dos veces el mismo día
              df_historico = df_historico[df_historico['Fecha_Extraccion'] != fecha_hoy]
              
              df_consolidado = pd.concat([df_historico, df_hoy], ignore_index=True)
          else:
              df_consolidado = df_hoy

          # Guardar el archivo maestro en formato CSV
          df_consolidado.to_csv(historico_csv, index=False, encoding='utf-8')

          print('3. Creando copia de seguridad diaria en ZIP...')
          with zipfile.ZipFile(zip_final, 'w', zipfile.ZIP_DEFLATED) as zipf:
              zipf.write(temp_xls, os.path.basename(temp_xls))

          # Limpieza del temporal pesado
          if os.path.exists(temp_xls):
              os.remove(temp_xls)
              
          print('¡Proceso de consolidación terminado con éxito!')
          "

      - name: Guardar cambios en GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add datos/
          
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en las gasolineras hoy"
          else
            git commit -m "Copia diaria y actualización de histórico - $(date +'%Y-%m-%d')"
            git push origin "HEAD:${BRANCH}"
          fi
