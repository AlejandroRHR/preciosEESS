name: Copia Diaria de Excel

permissions:
  contents: write

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite activar el proceso manualmente

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar dependencias para Excel
        run: pip install pandas openpyxl requests

      - name: Crear carpeta de datos
        run: mkdir -p datos

      - name: Descargar datos mediante Proxy y convertir a XLSX
        run: |
          python -c "
          import requests
          import pandas as pd
          from datetime import datetime
          import urllib.parse
          
          # URL original de la API del Ministerio
          url_original = 'https://minetur.gob.es'
          
          # Corrección en el formateo de la URL agregando la separación fija de la query string
          url_proxy = 'https://allorigins.win' + urllib.parse.quote_plus(url_original)
          
          filename = f'datos/data_{datetime.now().strftime(\"%Y-%m-%d\")}.xlsx'
          
          try:
              print('Solicitando datos a través del puente Proxy...')
              response = requests.get(url_proxy, timeout=60)
              response.raise_for_status()
              
              data = response.json()
              estaciones = data.get('ListaEESSPrecio', [])
              
              if not estaciones:
                  print('Error: El proxy respondió pero la estructura de datos está vacía')
                  exit(1)
                  
              # Estructurar en tabla y guardar en formato Excel moderno (.xlsx)
              df = pd.DataFrame(estaciones)
              df.to_excel(filename, index=False, engine='openpyxl')
              print(f'¡Éxito total! Archivo puente guardado como {filename}')
              
          except Exception as e:
              print(f'Error crítico en el proceso: {e}')
              exit(1)
          "

      - name: Guardar cambios en GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add datos/
          
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar"
          else
            git commit -m "Copia automática del Excel - $(date +'%Y-%m-%d')"
            git push origin "HEAD:${BRANCH}"
          fi
