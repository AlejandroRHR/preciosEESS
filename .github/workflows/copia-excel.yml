name: Copia Diaria de Gasolineras (ZIP Seguro)

permissions:
  contents: write

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite activar el proceso manualmente desde la pestaña Actions

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Crear carpeta de datos
        run: mkdir -p datos

      - name: Descargar, Validar y Comprimir de forma segura
        run: |
          FECHA=$(date +'%Y-%m-%d')
          TEMP_XLS="datos/temp_precios.xls"
          ZIP_FINAL="datos/data_${FECHA}.zip"
          URL="https://geoportalgasolineras.es/resources/files/preciosEESS_es.xls"
          
          echo "Iniciando descarga segura con wget..."
          wget --no-check-certificate \
               --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
               --header="Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
               --header="Accept-Language: es-ES,es;q=0.8" \
               --header="Connection: keep-alive" \
               "$URL" -O "$TEMP_XLS" || { echo "Error: El servidor del Ministerio rechazó la conexión"; exit 1; }
          
          # VALIDACIÓN ANTIBLOQUEO DEFINITIVA:
          # Si el archivo contiene la palabra DOCTYPE, significa que el Ministerio nos ha bloqueado devolviendo un HTML de error.
          if grep -q "<!DOCTYPE" "$TEMP_XLS"; then
            echo "Error crítico: El cortafuegos del Ministerio ha devuelto un HTML de bloqueo en lugar del Excel."
            exit 1
          fi
          
          if [ ! -s "$TEMP_XLS" ]; then
            echo "Error: El archivo descargado está vacío"
            exit 1
          fi
          
          echo "Archivo Excel validado correctamente. Procediendo a la compresión ZIP..."
          # Comprimir el archivo original con la extensión xls para que guarde la estructura nativa del Geoportal
          # Renombramos internamente el archivo dentro del zip para que mantenga la fecha al extraerlo
          mv "$TEMP_XLS" "datos/precios_${FECHA}.xls"
          zip -j "$ZIP_FINAL" "datos/precios_${FECHA}.xls"
          
          # Limpiar carpetas temporales para optimizar el almacenamiento del repositorio
          rm "datos/precios_${FECHA}.xls"
          
          echo "¡Éxito absoluto! Copia de seguridad guardada en $ZIP_FINAL"

      - name: Guardar cambios en GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          
          if git diff --cached --quiet; then
            echo "El archivo descargado hoy es idéntico al de ayer. No se requieren cambios."
          else
            git commit -m "Copia diaria de seguridad garantizada (ZIP) - $(date +'%Y-%m-%d')"
            git push origin "HEAD:${BRANCH}"
          fi
