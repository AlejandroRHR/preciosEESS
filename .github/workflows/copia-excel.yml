name: Copia Diaria de Excel

permissions:
  contents: write

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permite activar el proceso manualmente

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Instalar dependencias para Excel
        run: pip install pandas xlwt requests

      - name: Crear carpeta de datos
        run: mkdir -p datos

      - name: Descargar datos y convertir a XLS
        run: |
          python -c "
          import requests
          import pandas as pd
          from datetime import datetime
          
          # URL de la API pública oficial sin restricciones de IP para GitHub
          url = 'https://minetur.gob.es'
          filename = f'datos/data_{datetime.now().strftime(\"%Y-%m-%d\")}.xls'
          
          try:
              print('Solicitando datos a la API oficial...')
              response = requests.get(url, timeout=30)
              response.raise_for_status()
              
              # Extraer la lista de estaciones de servicio
              data = response.json()
              estaciones = data.get('ListaEESSPrecio', [])
              
              if not estaciones:
                  print('Error: La API devolvió una lista vacía')
                  exit(1)
                  
              # Convertir a tabla y exportar directamente a formato Excel (.xls)
              df = pd.DataFrame(estaciones)
              df.to_excel(filename, index=False, engine='xlwt')
              print(f'¡Éxito! Archivo convertido y guardado como {filename}')
              
          except Exception as e:
              print(f'Error durante el proceso: {e}')
              exit(1)
          "

      - name: Guardar cambios en GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos que guardar"
          else
            git commit -m "Copia automática del Excel - $(date +'%Y-%m-%d')"
            git push origin "HEAD:${BRANCH}"
          fi

