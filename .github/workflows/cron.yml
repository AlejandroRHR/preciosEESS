name: Copia Diaria de Excel

permissions:
  contents: write

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Esto permite activar el proceso manualmente cuando quieras probarlo

jobs:
  download-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Crear carpeta de datos
        run: mkdir -p datos

      - name: Descargar datos de la web
        run: |
          FILENAME="datos/data_$(date +'%Y-%m-%d').xls"
          URL="https://geoportalgasolineras.es/resources/files/preciosEESS_es.xls"
          # -f: fail on HTTP errors, -sS: silent but show errors
          curl -sS -f -H "User-Agent: github-actions" "$URL" -o "$FILENAME" || { echo "Error: curl HTTP failure"; exit 1; }
          if [ ! -s "$FILENAME" ]; then
            echo "Error: API response is empty"
            exit 1
          fi
          echo "Archivo guardado como $FILENAME"

      - name: Guardar cambios en GitHub
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          # Commit only if there are staged changes
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar"
          else
            git commit -m "Copia automática del día $(date +'%Y-%m-%d')"
            git push origin "HEAD:${BRANCH}"
          fi
