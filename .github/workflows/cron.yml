name: Copia Diaria de Excel

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 AM UTC (Equivale a las 09:00 o 10:00 en España según el horario de verano/invierno)
    - cron: '0 8 * * *'
  workflow_dispatch: # Te permite activar el botón para probarlo manualmente

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Ejecutar script de extracción
      run: python script.py

    - name: Subir cambios al repositorio
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add copias_excel/*
        git diff --quiet && git diff --staged --quiet || (git commit -m "Copia diaria de Excel: $(date +'%Y-%m-%d')" && git push)
